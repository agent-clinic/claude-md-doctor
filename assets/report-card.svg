<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,sans-serif" role="img" aria-label="Sample checkup report: grade B, one critical dead reference, one ignored rule with a session timeline, one prescription">
  <!-- card -->
  <rect x="1" y="1" width="758" height="298" rx="14" fill="#f6f7f5" stroke="#d8dcd6"/>

  <!-- header -->
  <g shape-rendering="crispEdges" transform="translate(26,22) scale(0.62)">
    <rect x="28" y="0" width="8" height="4" fill="#5fd4c8"/><rect x="30" y="4" width="4" height="4" fill="#93a0af"/>
    <rect x="12" y="8" width="40" height="24" fill="#93a0af"/>
    <rect x="40" y="8" width="4" height="4" fill="#d4a04c"/><rect x="44" y="4" width="8" height="8" fill="#d4a04c"/><rect x="46" y="6" width="4" height="4" fill="#fdfdfc"/>
    <rect x="16" y="16" width="32" height="8" fill="#2b3440"/>
    <rect x="20" y="18" width="6" height="4" fill="#5fd4c8"/><rect x="38" y="18" width="6" height="4" fill="#5fd4c8"/>
    <rect x="26" y="27" width="12" height="2" fill="#2b3440"/>
    <rect x="26" y="32" width="12" height="4" fill="#93a0af"/>
    <rect x="14" y="34" width="36" height="24" fill="#93a0af"/><rect x="16" y="36" width="32" height="20" fill="#fdfdfc"/>
    <rect x="30" y="40" width="4" height="12" fill="#b23c2e"/><rect x="26" y="44" width="12" height="4" fill="#b23c2e"/>
  </g>
  <text x="78" y="38" font-size="11" letter-spacing="2.5" fill="#5b6470" font-family="ui-monospace,Menlo,monospace">CLAUDE-MD-DOCTOR · CHECKUP REPORT</text>
  <text x="78" y="60" font-size="21" font-weight="700" fill="#1c2024">demo-repo</text>

  <!-- grade chip -->
  <rect x="642" y="20" width="92" height="58" rx="3" fill="#ffffff" stroke="#2f6f5e" stroke-width="2.5"/>
  <rect x="647" y="82" width="92" height="4" fill="#d8dcd6"/>
  <text x="688" y="52" font-size="30" font-weight="700" fill="#2f6f5e" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">B</text>
  <g shape-rendering="crispEdges" fill="#2f6f5e" transform="translate(655,60) scale(0.9)">
    <g><rect x="2" y="0" width="4" height="2"/><rect x="8" y="0" width="4" height="2"/><rect x="0" y="2" width="14" height="4"/><rect x="2" y="6" width="10" height="2"/><rect x="4" y="8" width="6" height="2"/><rect x="6" y="10" width="2" height="2"/></g>
    <g transform="translate(17,0)"><rect x="2" y="0" width="4" height="2"/><rect x="8" y="0" width="4" height="2"/><rect x="0" y="2" width="14" height="4"/><rect x="2" y="6" width="10" height="2"/><rect x="4" y="8" width="6" height="2"/><rect x="6" y="10" width="2" height="2"/></g>
    <g transform="translate(34,0)"><rect x="2" y="0" width="4" height="2"/><rect x="8" y="0" width="4" height="2"/><rect x="0" y="2" width="14" height="4"/><rect x="2" y="6" width="10" height="2"/><rect x="4" y="8" width="6" height="2"/><rect x="6" y="10" width="2" height="2"/></g>
    <g transform="translate(51,0)"><rect x="2" y="0" width="4" height="2"/><rect x="8" y="0" width="4" height="2"/><rect x="0" y="2" width="14" height="4"/><rect x="2" y="6" width="10" height="2"/><rect x="4" y="8" width="6" height="2"/><rect x="6" y="10" width="2" height="2"/></g>
    <g transform="translate(68,0)" opacity="0.25"><rect x="2" y="0" width="4" height="2"/><rect x="8" y="0" width="4" height="2"/><rect x="0" y="2" width="14" height="4"/><rect x="2" y="6" width="10" height="2"/><rect x="4" y="8" width="6" height="2"/><rect x="6" y="10" width="2" height="2"/></g>
  </g>

  <!-- ecg divider -->
  <path d="M26 96 H180 V90 H184 V96 H220 V100 H224 V96 H400 V88 H404 V101 H408 V96 H560 V90 H564 V96 H600 V100 H604 V96 H734" fill="none" stroke="#2f6f5e" stroke-width="2" shape-rendering="crispEdges"/>

  <!-- diagnosis row 1: dead ref -->
  <rect x="26" y="112" width="708" height="50" rx="8" fill="#ffffff" stroke="#e3e6e2"/>
  <rect x="40" y="126" width="58" height="18" rx="9" fill="#f9e9e6"/>
  <text x="69" y="139" font-size="10.5" font-weight="700" fill="#b23c2e" text-anchor="middle">critical</text>
  <rect x="104" y="126" width="64" height="18" rx="9" fill="#e6eef7"/>
  <text x="136" y="139" font-size="10.5" font-weight="700" fill="#2a6fb8" text-anchor="middle">dead-ref</text>
  <text x="180" y="140" font-size="13.5" font-weight="650" fill="#1c2024">Backend path points at a teammate's machine</text>
  <text x="510" y="140" font-size="11.5" fill="#8a93a0" font-family="ui-monospace,Menlo,monospace">CLAUDE.md:58</text>

  <!-- diagnosis row 2: ignored rule with timeline -->
  <rect x="26" y="172" width="708" height="72" rx="8" fill="#ffffff" stroke="#e3e6e2"/>
  <rect x="40" y="184" width="60" height="18" rx="9" fill="#f9e9e6"/>
  <text x="70" y="197" font-size="10.5" font-weight="700" fill="#b23c2e" text-anchor="middle">ignored</text>
  <text x="112" y="198" font-size="13.5" font-weight="650" fill="#1c2024">"Run verify before you finish"</text>
  <text x="340" y="198" font-size="12.5" fill="#5b6470">compliance where it applied:</text>
  <text x="502" y="198" font-size="13" font-weight="700" fill="#b23c2e">0%</text>
  <!-- timeline strip -->
  <g shape-rendering="crispEdges">
    <rect x="40" y="212" width="52" height="12" fill="#d4a04c"/>
    <rect x="92" y="212" width="86" height="12" fill="#5f8fc9"/>
    <rect x="178" y="212" width="34" height="12" fill="#d4a04c"/>
    <rect x="212" y="212" width="60" height="12" fill="#5f8fc9"/>
    <rect x="272" y="212" width="24" height="12" fill="#d4a04c"/>
    <rect x="296" y="212" width="150" height="12" fill="#5f8fc9"/>
    <rect x="446" y="212" width="60" height="12" fill="#b7bec7"/>
    <rect x="296" y="222" width="210" height="4" fill="#b23c2e"/>
  </g>
  <text x="516" y="223" font-size="11.5" fill="#5b6470">after the last edit:</text>
  <text x="616" y="223" font-size="11.5" font-weight="700" fill="#b23c2e">✗ verify never ran</text>

  <!-- prescription -->
  <rect x="26" y="254" width="708" height="32" rx="8" fill="#e7f1ee"/>
  <g shape-rendering="crispEdges" transform="translate(40,262)">
    <rect x="0" y="4" width="8" height="8" fill="#b23c2e"/>
    <rect x="8" y="4" width="8" height="8" fill="#fdfdfc" stroke="#b23c2e" stroke-width="1"/>
  </g>
  <text x="64" y="274" font-size="12.5" fill="#1c2024"><tspan font-weight="700" fill="#2f6f5e">Rx</tspan>  Graduate this rule to a hook — prose is advisory; hooks execute.  <tspan fill="#8a93a0" font-size="11">[official docs · SIGIL 2026]</tspan></text>
</svg>
